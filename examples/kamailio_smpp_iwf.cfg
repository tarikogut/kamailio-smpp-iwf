#!KAMAILIO
#
# Kamailio SMS-IWF & SMPP Server/Client Configuration
# Architecture:
#   [Client (You)] -> SMPP (Port 2779) -> [Kamailio SMS-IWF] -> [SMSC Simulators 1..4]
#   [SIP Client]   -> SIP MESSAGE (Port 5060) -> [Kamailio SMS-IWF] -> [SMSC Simulators]
#   [HTTP Client]  -> REST API (Port 8080)    -> [Kamailio SMS-IWF] -> [SMSC Simulators]
#

####### Global Parameters #########
debug=2
log_stderror=yes
children=2

listen=tcp:0.0.0.0:5060
listen=udp:0.0.0.0:5060

mhomed=0
tcp_accept_aliases=no

####### Modules Section #########
mpath="/usr/local/lib64/kamailio/modules/"

loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "smpp.so"

####### SMPP Module Configuration #########
modparam("smpp", "listen_ip", "0.0.0.0")
modparam("smpp", "listen_port", 2779)
modparam("smpp", "default_client_mps", 50)
modparam("smpp", "enquire_link_interval", 30)
modparam("smpp", "reconnect_interval", 10)
modparam("smpp", "http_api_enable", 1)
modparam("smpp", "http_api_port", 8080)
modparam("smpp", "http_api_token", "secret-token-123")

####### Routing Logic #########
request_route {
    # Handle SIP MESSAGE (SIP-to-SMPP translation)
    if (is_method("MESSAGE")) {
        xlog("L_INFO", "Received SIP MESSAGE from $fu to $ru: '$rb'\n");
        
        # Route via smpp_send(SMSC, from, to, text)
        if (smpp_send("sim1", "$fU", "$rU", "$rb")) {
            xlog("L_INFO", "Successfully forwarded SIP MESSAGE to SMPP sim1\n");
            sl_send_reply("200", "OK (Forwarded to SMPP)");
        } else {
            xlog("L_ERR", "Failed to forward SIP MESSAGE to SMPP sim1\n");
            sl_send_reply("500", "Server Internal Error - SMPP Gateway Failed");
        }
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    drop;
}
